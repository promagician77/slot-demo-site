<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#020b14" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="description" content="Nocturne Reef: a playable HTML5 slot demo built with PixiJS v8 and TypeScript, with a server-authoritative math engine, free spins with sticky wilds, sound, history replay and recovery." />
  <title>Nocturne Reef · HTML5 slot demo (PixiJS + TypeScript)</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23062a3a'/%3E%3Ccircle cx='16' cy='15' r='7' fill='%235ef2e0'/%3E%3C/svg%3E" />
  <script type="module" crossorigin src="./assets/index-D1eSq3V4.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/CanvasPool-6PJpnc_3.js">
  <link rel="modulepreload" crossorigin href="./assets/canvasUtils-BPf5fO0w.js">
  <link rel="modulepreload" crossorigin href="./assets/RenderTargetSystem-DdZpf_un.js">
  <link rel="modulepreload" crossorigin href="./assets/getTextureBatchBindGroup-Bj6kWNfI.js">
  <link rel="modulepreload" crossorigin href="./assets/getTexelRangeRects-D6H6agko.js">
  <link rel="stylesheet" crossorigin href="./assets/index-B_fwqQ07.css">
</head>
<body>
  <div id="app" class="app" data-busy="false">
    <div id="stage" class="stage" aria-hidden="true"></div>

    <header class="top">
      <h1 class="logo" aria-label="Nocturne Reef"><span class="logo-a">Nocturne</span><span class="logo-b">Reef</span></h1>
      <p class="session" id="session"></p>
      <div class="top-actions">
        <button id="btn-sound" class="icon" type="button" aria-pressed="true">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path class="ic-speaker" d="M4 9h4l5-4v14l-5-4H4z"/><path class="ic-waves" d="M16 8.5c1.2 1 1.8 2.2 1.8 3.5s-.6 2.5-1.8 3.5M18.5 6c2 1.6 3 3.6 3 6s-1 4.4-3 6"/><path class="ic-mute" d="M16 9l5 6m0-6l-5 6"/></svg>
        </button>
        <button id="btn-menu" class="icon" type="button" aria-haspopup="dialog">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
      </div>
    </header>

    <main class="play">
      <div class="hero" aria-hidden="true"><span class="hero-a">Nocturne</span><span class="hero-b">Reef</span><small class="hero-tag" data-t="tagline"></small></div>
      <div id="reel-slot" class="reel-slot"></div>
      <div id="banner" class="banner" hidden></div>
      <p id="message" class="message" role="status" aria-live="polite" data-t="goodLuck"></p>
    </main>

    <footer class="controls">
      <div class="meters">
        <div class="meter"><span class="label" data-t="balance"></span><output id="balance"></output></div>
        <div class="meter meter-win"><span class="label" data-t="win"></span><output id="win"></output></div>
      </div>
      <div class="buttons">
        <button id="btn-auto" class="pill" type="button" aria-haspopup="dialog"><span data-t="auto"></span></button>
        <div class="bet">
          <button id="bet-down" class="round" type="button">−</button>
          <div class="bet-value"><span class="label" data-t="bet"></span><output id="bet"></output></div>
          <button id="bet-up" class="round" type="button">+</button>
        </div>
        <button id="btn-spin" class="spin" type="button">
          <svg class="spin-ring" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="46"/></svg>
          <svg class="spin-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5"/></svg>
          <span class="spin-stop" aria-hidden="true"></span>
          <span class="spin-count" aria-hidden="true"></span>
        </button>
        <button id="btn-turbo" class="pill" type="button" aria-pressed="false"><span data-t="turbo"></span></button>
      </div>
    </footer>

    <section id="feature-panel" class="feature-panel" hidden role="dialog" aria-modal="true" aria-labelledby="fp-title">
      <p class="fp-kicker" id="fp-kicker"></p>
      <h2 class="fp-title" id="fp-title"></h2>
      <p class="fp-body" id="fp-body"></p>
      <button class="cta" id="fp-go" type="button"></button>
    </section>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

    <div id="loader" class="loader">
      <p class="loader-logo"><span>Nocturne</span><span>Reef</span></p>
      <div class="loader-bar"><i id="loader-fill"></i></div>
    </div>
  </div>

  <dialog id="menu" class="sheet" aria-labelledby="menu-title">
    <div class="sheet-head">
      <h2 id="menu-title" class="visually-hidden"></h2>
      <div class="tabs" role="tablist" id="menu-tabs"></div>
      <button class="icon close" type="button" data-close><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div class="sheet-body" id="menu-body"></div>
  </dialog>

  <dialog id="auto-dlg" class="sheet small" aria-labelledby="auto-title">
    <div class="sheet-head"><h2 id="auto-title"></h2><button class="icon close" type="button" data-close><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <form method="dialog" class="sheet-body" id="auto-form"></form>
  </dialog>

  <dialog id="alert" class="sheet small" aria-labelledby="alert-title">
    <div class="sheet-head"><h2 id="alert-title"></h2></div>
    <div class="sheet-body"><p id="alert-body"></p><div class="row-actions" id="alert-actions"></div></div>
  </dialog>

  <div id="fps" class="fps" hidden></div>
</body>
</html>
